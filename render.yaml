# Runs the sync server on Render (https://render.com). In Render, choose
# New > Blueprint and pick this repository. The free plan is enough: the
# server sleeps after 15 minutes without connections and takes about a
# minute to wake when someone next opens a room.
services:
  - type: web
    name: tandem-sync
    runtime: docker
    plan: free
    # Paths are from the top of the repository.
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    # Redeploy only when the server itself changes.
    buildFilter:
      paths:
        - server/**
    healthCheckPath: /
    envVars:
      # Synaxis's Watch Together brings groups; Tandem's own default is 2.
      - key: MAX_MEMBERS
        value: "8"
