# Checks the app on every push, and builds the Linux and Windows apps.
# Download the builds from the run's "Artifacts" section on the Actions tab.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  linux:
    name: Linux app
    needs: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
      - name: Package
        run: tar -C build/linux/x64/release -czf "$GITHUB_WORKSPACE/syncus-linux-x64.tar.gz" bundle
      - uses: actions/upload-artifact@v4
        with:
          name: syncus-linux-x64
          path: syncus-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows app
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      # upload-artifact zips the folder itself: unzip it and run syncus.exe.
      - uses: actions/upload-artifact@v4
        with:
          name: syncus-windows-x64
          path: app/build/windows/x64/runner/Release
          if-no-files-found: error
