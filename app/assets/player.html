<!doctype html>
<!--
  Hosts the official YouTube IFrame player. The Flutter app loads this page in
  a WebView and talks to it two ways:
    app  -> page : calls the functions on window.mendu (load/play/pause/seek)
    page -> app  : post({type: ...}) messages, sent through the WebView bridge
  See docs/protocol.md ("Player page bridge") for the message list.
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #player { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    // ---- page -> app -------------------------------------------------------
    var bridgeReady = !!(window.flutter_inappwebview && window.flutter_inappwebview.callHandler);
    var outbox = [];

    function post(message) {
      if (!bridgeReady) { outbox.push(message); return; }
      window.flutter_inappwebview.callHandler('mendu', JSON.stringify(message));
    }

    window.addEventListener('flutterInAppWebViewPlatformReady', function () {
      bridgeReady = true;
      outbox.splice(0).forEach(post);
    });

    // ---- the player --------------------------------------------------------
    var player = null;
    var playerReady = false;

    function snapshot() {
      return {
        type: 'tick',
        state: player.getPlayerState(),      // -1 unstarted, 0 ended, 1 playing, 2 paused, 3 buffering, 5 cued
        position: player.getCurrentTime() || 0,
        duration: player.getDuration() || 0,
        rate: player.getPlaybackRate() || 1
      };
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        width: '100%',
        height: '100%',
        playerVars: { playsinline: 1, rel: 0, origin: location.origin },
        events: {
          onReady: function () {
            playerReady = true;
            post({ type: 'ready' });
            setInterval(function () { post(snapshot()); }, 250);
          },
          onStateChange: function () { post(snapshot()); },
          onError: function (e) { post({ type: 'error', code: e.data }); }
        }
      });
    }

    // ---- app -> page -------------------------------------------------------
    window.mendu = {
      load: function (videoId, startSeconds) {
        if (playerReady) player.loadVideoById(videoId, startSeconds || 0);
      },
      play: function () { if (playerReady) player.playVideo(); },
      pause: function () { if (playerReady) player.pauseVideo(); },
      seek: function (seconds) { if (playerReady) player.seekTo(seconds, true); }
    };

    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  </script>
</body>
</html>
